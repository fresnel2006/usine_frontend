<div class="tableau-pied">
  <span class="muted" data-info></span>
  <div class="pagination">
    <label class="par-page">Lignes par page
      <select class="select" data-par-page>
        <option value="10" selected>10</option>
        <option value="25">25</option>
        <option value="50">50</option>
      </select>
    </label>
    <button type="button" class="icon-btn" data-precedent aria-label="Page précédente">{% icone "chevron-left" 16 %}</button>
    <span class="numero-page" data-numero></span>
    <button type="button" class="icon-btn" data-suivant aria-label="Page suivante">{% icone "chevron-right" 16 %}</button>
  </div>
</div>
