{% if messages %}
<div class="toasts" role="status" aria-live="polite">
  {% for message in messages %}
    <div class="toast {% if message.level_tag == 'error' %}erreur{% else %}succes{% endif %}">
      {% if message.level_tag == 'error' %}{% icone "circle-alert" 18 %}{% else %}{% icone "circle-check" 18 %}{% endif %}
      <div class="toast-message">{{ message }}</div>
      <button type="button" class="toast-fermer" aria-label="Fermer">{% icone "x" 16 %}</button>
    </div>
  {% endfor %}
</div>
{% endif %}
